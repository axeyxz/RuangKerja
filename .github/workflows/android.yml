name: Build Axey Workspace APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-35'
      - name: Install Android build tools
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install 'build-tools;35.0.0'
      - name: Install Android NDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install 'ndk;29.0.14206865'
      - name: Build SOCKS5 native tunnel
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev-socks5-tunnel
          cd /tmp/hev-socks5-tunnel
          /usr/local/lib/android/sdk/ndk/29.0.14206865/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_ABI=arm64-v8a APP_CFLAGS='-DPKGNAME=com/axey/workspace -DCLSNAME=ProxyVpnService'
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp libs/arm64-v8a/libhev-socks5-tunnel.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
      - name: Decode permanent signing key
        env:
          AKEY: ${{ secrets.AXEY_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.AXEY_KEY_ALIAS }}
          STOREPASS: ${{ secrets.AXEY_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.AXEY_KEY_PASSWORD }}
        run: |
          test -n "$AKEY" || (echo "Missing AKEYSTORE secret"; exit 1)
          test -n "$ALIAS" || (echo "Missing AXEY_KEY_ALIAS secret"; exit 1)
          test -n "$STOREPASS" || (echo "Missing AXEY_KEYSTORE_PASSWORD secret"; exit 1)
          test -n "$KEYPASS" || (echo "Missing AXEY_KEY_PASSWORD secret"; exit 1)
          # Remove whitespace introduced by copying a multiline Base64 value into GitHub Secrets.
          AKEY_CLEAN="$(printf '%s' "$AKEY" | tr -d '[:space:]')"
          if ! printf '%s' "$AKEY_CLEAN" | base64 --decode > "$RUNNER_TEMP/axey-upload-key.jks"; then
            echo "::error::AXEY_KEYSTORE_BASE64 is not valid Base64. Re-copy the complete contents of KEYSTORE-BASE64.txt into this secret."
            exit 1
          fi
          test -s "$RUNNER_TEMP/axey-upload-key.jks" || (echo "::error::Decoded keystore is empty"; exit 1)
          keytool -list -keystore "$RUNNER_TEMP/axey-upload-key.jks" -storepass "$STOREPASS" -alias "$ALIAS"
          echo "AXEY_KEYSTORE_PATH=$RUNNER_TEMP/axey-upload-key.jks" >> "$GITHUB_ENV"
          echo "AXEY_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "AXEY_KEYSTORE_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"
          echo "AXEY_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature
        run: /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Read app version
        id: app_version
        run: |
          VERSION="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)"
          test -n "$VERSION" || (echo "::error::Unable to read versionName from app/build.gradle"; exit 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          gh release create "v$VERSION" app/build/outputs/apk/release/app-release.apk --title "Axey Workspace $VERSION" --notes "Axey Workspace $VERSION. Includes in-app update checks and user-approved installation."
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axey-Workspace-${{ steps.app_version.outputs.version }}-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
