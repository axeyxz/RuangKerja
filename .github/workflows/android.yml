name: Build Axey Workspace APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-35'
      - name: Install Android build tools
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install 'build-tools;35.0.0'
      - name: Install Android NDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install 'ndk;29.0.14206865'
      - name: Build SOCKS5 native tunnel
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev-socks5-tunnel
          cd /tmp/hev-socks5-tunnel
          /usr/local/lib/android/sdk/ndk/29.0.14206865/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_ABI=arm64-v8a APP_CFLAGS='-DPKGNAME=com/axey/workspace -DCLSNAME=ProxyVpnService'
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp libs/arm64-v8a/libhev-socks5-tunnel.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Axey-Workspace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
