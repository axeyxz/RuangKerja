plugins { id 'com.android.application' }

android {
    namespace 'com.axey.workspace'
    compileSdk 35

    defaultConfig {
        applicationId 'com.axey.workspace'
        minSdk 28
        targetSdk 35
        versionCode 11
        versionName '1.2.8'
    }

    signingConfigs {
        release {
            def ks = System.getenv('AXEY_KEYSTORE_PATH')
            if (ks != null) {
                storeFile file(ks)
                storePassword System.getenv('AXEY_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AXEY_KEY_ALIAS')
                keyPassword System.getenv('AXEY_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
